          label="Start date"
          value={details.startDate}
          read-only
          readonly-textlike
        ></c-input-text>

        <c-input-text
          label="End date"
          value={details.endDate}
          read-only
          readonly-textlike
        ></c-input-text>

        <c-input-text
          label="Vacation type"
          value={typeLabel}
          read-only
          readonly-textlike
        ></c-input-text>

        <c-input-text
          label="Comment"
          value={details.comment}

          readonly-textlike
