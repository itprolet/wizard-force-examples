          label="Start date"
          value={details.startDate}
          read-only
          readonly-textlike
        ></prolet-input-text>

        <prolet-input-text
          label="End date"
          value={details.endDate}
          read-only
          readonly-textlike
        ></prolet-input-text>

        <prolet-input-text
          label="Vacation type"
          value={typeLabel}
          read-only
          readonly-textlike
        ></prolet-input-text>

        <prolet-input-text
          label="Comment"
          value={details.comment}
          read-only
          readonly-textlike
        ></prolet-input-text>
