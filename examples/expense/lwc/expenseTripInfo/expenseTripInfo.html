<template>
  <article class="eh-page">
    <section>
      <div class="slds-grid slds-gutters_x-small slds-wrap">
        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
          <prolet-input-combobox
            label={_l.Expense_lbl_destinationType}
            name="destinationType"
            items={destinationTypeOptions}
            value={data.destinationType}
            onchange={changeHandler}
            required={_required.destinationType}
            read-only={_readOnly.destinationType}
            error={_errors.destinationType}
          ></prolet-input-combobox>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
          <prolet-input-text
            label={_l.Expense_lbl_destination}
            name="destination"
            value={data.destination}
            onchange={changeHandler}
            required={_required.destination}
            read-only={_readOnly.destination}
            error={_errors.destination}
          ></prolet-input-text>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
          <prolet-input-text
            type="date"
            label={_l.Expense_lbl_dateFrom}
            name="dateFrom"
            value={data.dateFrom}
            onchange={changeHandler}
            required={_required.dateFrom}
            read-only={_readOnly.dateFrom}
            error={_errors.dateFrom}
          ></prolet-input-text>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
          <!-- errors.dateTo is set by the JS page validator ValidateTripDates -->
          <prolet-input-text
            type="date"
            label={_l.Expense_lbl_dateTo}
            name="dateTo"
            value={data.dateTo}
            onchange={changeHandler}
            required={_required.dateTo}
            read-only={_readOnly.dateTo}
            error={_errors.dateTo}
          ></prolet-input-text>
        </div>
        <div class="slds-col slds-size_1-of-1">
          <!-- the records come from the query in Smart_Lookup_Setting.Expense_AccountId (customMetadata) -->
          <prolet-input-suggester
            label={_l.Expense_lbl_account}
            lookup-name="Expense_AccountId"
            key-field="Id"
            name-field="Name"
            selected-id={data.accountId}
            selected-name={data.accountName}
            onsmartlookupselected={accountSelected}
            required={_required.accountId}
            read-only={_readOnly.accountId}
            error={_errors.accountId}
          ></prolet-input-suggester>
        </div>
        <div class="slds-col slds-size_1-of-1">
          <prolet-input-text
            multiline
            label={_l.Expense_lbl_purpose}
            name="purpose"
            value={data.purpose}
            onchange={changeHandler}
            required={_required.purpose}
            read-only={_readOnly.purpose}
            error={_errors.purpose}
            message={_hints.purpose}
          ></prolet-input-text>
        </div>
      </div>
    </section>
  </article>
</template>
