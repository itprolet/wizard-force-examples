<template>
  <article class="eh-page">
    <section>
      <!--
        This page is CONDITIONAL: it only appears when eventType is 'in-person' or 'hybrid'.
        The Plan condition in the metadata is:
          "if (not(ShowcaseEventType.eventType='online'))": { "Preferences": "ShowcasePreferences" }
        This demonstrates cross-page conditional pages driven by the Rules engine.
      -->
      <prolet-elem-alert type="info">
        These preferences apply to your on-site experience. All fields marked
        with * are required so we can prepare accordingly.
      </prolet-elem-alert>
    </section>

    <section>
      <div class="slds-grid slds-gutters_x-small slds-wrap">
        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
          <prolet-input-combobox
            label="Dietary Requirement"
            name="dietaryOption"
            items={dietaryOptions}
            value={data.dietaryOption}
            onchange={handleChange}
            required={_required.dietaryOption}
            read-only={_readOnly.dietaryOption}
            error={_errors.dietaryOption}
          ></prolet-input-combobox>
        </div>

        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
          <prolet-input-combobox
            label="T-Shirt Size"
            name="shirtSize"
            items={shirtSizeOptions}
            value={data.shirtSize}
            onchange={handleChange}
            required={_required.shirtSize}
            read-only={_readOnly.shirtSize}
            error={_errors.shirtSize}
          ></prolet-input-combobox>
        </div>

        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
          <prolet-input-combobox
            label="Accommodation"
            name="accommodation"
            items={accommodationOptions}
            value={data.accommodation}
            onchange={handleChange}
            read-only={_readOnly.accommodation}
            error={_errors.accommodation}
          ></prolet-input-combobox>
        </div>

        <div class="slds-col slds-size_1-of-1">
          <prolet-input-checkbox
            label="I would like to use the airport shuttle service"
            name="shuttle"
            checked={data.shuttle}
            onchange={handleChange}
            read-only={_readOnly.shuttle}
          ></prolet-input-checkbox>
        </div>
      </div>
    </section>

    <!-- Contextual warning when accommodation is booked -->
    <template lwc:if={isAccommodationBooked}>
      <section>
        <prolet-elem-alert type="warning">
          Accommodation is subject to availability and will be confirmed
          separately via email within 3 business days.
        </prolet-elem-alert>
      </section>
    </template>
  </article>
</template>
